version: 2
updates:

  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      swift:
        patterns: ["*"]

  # Grouped into a single PR so related action bumps land together rather than
  # as a stream of separate PRs. Auto-merge handles them once CI passes.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
