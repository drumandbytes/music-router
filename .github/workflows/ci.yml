name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: swift build
      - run: swift test --enable-code-coverage
      - name: Coverage summary
        run: |
          xcrun llvm-cov report \
            .build/debug/MusicRouterTests.xctest/Contents/MacOS/MusicRouterTests \
            -instr-profile=.build/debug/codecov/default.profdata \
            -ignore-filename-regex='\.build|Tests' | tee -a "$GITHUB_STEP_SUMMARY"

  zizmor:
    uses: drumandbytes/reusable-actions/.github/workflows/zizmor.yml@v1

  # The one name the ruleset requires, however the jobs above change.
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    needs: [test, zizmor]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
